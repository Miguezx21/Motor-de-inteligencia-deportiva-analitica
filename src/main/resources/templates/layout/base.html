<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' — JEMPE Admin'">JEMPE Admin</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-brand">
    <img th:src="@{/img/logo.png}" alt="JEMPE" class="sidebar-logo" onerror="this.style.display='none'">
    <p class="sidebar-subtitle">Panel Administrativo</p>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-title">Principal</div>
    <a th:href="@{/dashboard}" th:classappend="${currentUri != null and currentUri == '/dashboard'} ? 'active'">Dashboard</a>
    <div class="nav-section-title">Configuración</div>
    <a th:href="@{/categorias}" th:classappend="${currentUri != null and #strings.startsWith(currentUri,'/categorias')} ? 'active'">Categorías</a>

    <div class="nav-section-title">Personas</div>
    <a th:href="@{/entrenadores}" th:classappend="${currentUri != null and #strings.startsWith(currentUri,'/entrenadores')} ? 'active'">Entrenadores</a>
    <a th:href="@{/padres}" th:classappend="${currentUri != null and #strings.startsWith(currentUri,'/padres')} ? 'active'">Padres / Tutores</a>
    <a th:href="@{/atletas}" th:classappend="${currentUri != null and #strings.startsWith(currentUri,'/atletas')} ? 'active'">Atletas</a>
    <div class="nav-section-title">Operación</div>
    <a th:href="@{/sesiones}" th:classappend="${currentUri != null and #strings.startsWith(currentUri,'/sesiones')} ? 'active'">Sesiones</a>
  </nav>
  <div class="sidebar-footer">Club JEMPE · Quito · v1.0</div>
</aside>
<div class="main-wrapper">
  <header class="topbar">
    <span class="topbar-title"><th:block th:replace="${title}"/></span>
    <div class="topbar-user">
      <span sec:authentication="name">Usuario</span>
      <span class="topbar-sep">·</span>
      <form th:action="@{/logout}" method="post" style="display:inline;margin:0">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="logout-btn">Cerrar sesión</button>
      </form>
    </div>
  </header>
  <main class="page-content">
    <div th:if="${exito}" class="alert alert-success">✓ <span th:text="${exito}"></span></div>
    <div th:if="${error}"  class="alert alert-danger">⚠ <span th:text="${error}"></span></div>
    <th:block th:replace="${content}"/>
  </main>
</div>
<script th:src="@{/js/cascading.js}"></script>
</body>
</html>
