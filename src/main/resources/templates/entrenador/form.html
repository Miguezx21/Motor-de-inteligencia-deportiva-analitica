<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title-text}, ~{::main-content})}">
<th:block th:fragment="title-text" th:text="${entrenador.id == null} ? 'Nuevo Entrenador' : 'Editar Entrenador'">Entrenador</th:block>
<th:block th:fragment="main-content">
<div class="card">
  <div class="card-header">
    <h2 th:text="${entrenador.id == null} ? '👨‍🏫 Nuevo Entrenador' : '✏️ Editar Entrenador'"></h2>
    <a th:href="@{/entrenadores}" class="btn btn-outline btn-sm" style="color:#fff;border-color:#fff">← Volver</a>
  </div>
  <div class="card-body">
    <form th:action="@{/entrenadores/guardar}" th:object="${entrenador}" method="post">
      <input type="hidden" th:field="*{id}">
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label">Cédula <span style="color:#dc3545">*</span> <span style="font-size:.75rem;color:#888">(validación Módulo 10 en servidor)</span></label>
          <input class="form-control" th:classappend="${#fields.hasErrors('cedula')} ? 'is-invalid'" type="text" id="cedula" th:field="*{cedula}" placeholder="10 dígitos" maxlength="10">
          <span id="cedulaHint" class="form-hint"></span>
          <span class="invalid-feedback" th:if="${#fields.hasErrors('cedula')}" th:errors="*{cedula}"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Nombre <span style="color:#dc3545">*</span></label>
          <input class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" type="text" th:field="*{nombre}">
          <span class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Apellido <span style="color:#dc3545">*</span></label>
          <input class="form-control" th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid'" type="text" th:field="*{apellido}">
          <span class="invalid-feedback" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Correo</label>
          <input class="form-control" type="email" th:field="*{correo}" placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <input class="form-control" type="text" th:field="*{telefono}">
        </div>
        <div class="form-group">
          <label class="form-label">Especialidad</label>
          <input class="form-control" type="text" th:field="*{especialidad}" placeholder="Ej: Velocidad y Sprint">
        </div>
        <div class="form-group">
          <label class="form-label">Estado</label>
          <select class="form-control" th:field="*{activo}">
            <option value="true">Activo</option>
            <option value="false">Inactivo</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:1rem;margin-top:1.5rem">
        <button type="submit" class="btn btn-accent">💾 Guardar</button>
        <a th:href="@{/entrenadores}" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
</div>
</th:block>
</html>
