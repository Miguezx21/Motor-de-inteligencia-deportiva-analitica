<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title-text}, ~{::main-content})}">
<th:block th:fragment="title-text">Entrenadores</th:block>
<th:block th:fragment="main-content">
<div class="card">
  <div class="card-header"><h2>👨‍🏫 Entrenadores</h2><a th:href="@{/entrenadores/nuevo}" class="btn btn-accent btn-sm">+ Nuevo</a></div>
  <div class="card-body">
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Cédula</th><th>Nombre</th><th>Correo</th><th>Especialidad</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody>
          <tr th:each="e : ${entrenadores}">
            <td th:text="${e.cedula}"></td>
            <td th:text="${e.nombre} + ' ' + ${e.apellido}"></td>
            <td th:text="${e.correo}"></td>
            <td th:text="${e.especialidad}"></td>
            <td><span th:class="${e.activo} ? 'badge badge-success' : 'badge badge-danger'" th:text="${e.activo} ? 'Activo' : 'Inactivo'"></span></td>
            <td style="display:flex;gap:.5rem">
              <a th:href="@{/entrenadores/editar/{id}(id=${e.id})}" class="btn btn-outline btn-sm">✏️</a>
              <form th:action="@{/entrenadores/eliminar/{id}(id=${e.id})}" method="post" onsubmit="return confirm('¿Eliminar?')">
                <button type="submit" class="btn btn-danger btn-sm">🗑️</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(entrenadores)}"><td colspan="6" style="text-align:center;color:#888;padding:2rem">Sin entrenadores</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</th:block>
</html>
