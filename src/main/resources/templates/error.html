<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Error ' + ${status} + ' — JEMPE Admin'">Error — JEMPE Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }
        .error-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,.08);
            padding: 48px 56px;
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        .error-code {
            font-size: 80px;
            font-weight: 700;
            color: #3b82f6;
            line-height: 1;
        }
        .error-title {
            font-size: 22px;
            font-weight: 600;
            margin: 16px 0 8px;
            color: #111;
        }
        .error-msg {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 32px;
            padding: 10px 28px;
            background: #3b82f6;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background .2s;
        }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code" th:text="${status}">500</div>
        <div class="error-title" th:text="${error}">Error interno</div>
        <p class="error-msg" th:text="${message}">Ocurrió un error inesperado.</p>
        <a th:href="@{/dashboard}" class="btn">← Volver al Dashboard</a>
    </div>
</body>
</html>
