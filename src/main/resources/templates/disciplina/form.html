<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title-text}, ~{::main-content})}">
<th:block th:fragment="title-text" th:text="${disciplina.id == null} ? 'Nueva Disciplina' : 'Editar Disciplina'">Disciplina</th:block>
<th:block th:fragment="main-content">
<div class="card">
  <div class="card-header">
    <h2 th:text="${disciplina.id == null} ? '🎯 Nueva Disciplina' : '✏️ Editar Disciplina'"></h2>
    <a th:href="@{/disciplinas}" class="btn btn-outline btn-sm" style="color:#fff;border-color:#fff">← Volver</a>
  </div>
  <div class="card-body">
    <form th:action="@{/disciplinas/guardar}" th:object="${disciplina}" method="post">
      <input type="hidden" th:field="*{id}">
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label">Nombre <span style="color:#dc3545">*</span></label>
          <input class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" type="text" th:field="*{nombre}" placeholder="Ej: 500m">
          <span class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Categoría <span style="color:#dc3545">*</span></label>
          <select class="form-control" th:field="*{categoria.id}">
            <option value="">— Seleccione categoría —</option>
            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}" th:selected="${disciplina.categoria?.id == c.id}"></option>
          </select>
        </div>
        <div class="form-group" style="grid-column:span 2">
          <label class="form-label">Descripción</label>
          <input class="form-control" type="text" th:field="*{descripcion}" placeholder="Descripción breve">
        </div>
      </div>
      <div style="display:flex;gap:1rem;margin-top:1.5rem">
        <button type="submit" class="btn btn-accent">💾 Guardar</button>
        <a th:href="@{/disciplinas}" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
</div>
</th:block>
</html>
