<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title-text}, ~{::main-content})}">
<th:block th:fragment="title-text" th:text="${padreTutor.id == null} ? 'Nuevo Padre/Tutor' : 'Editar Padre/Tutor'">Padre</th:block>
<th:block th:fragment="main-content">
<div class="card">
  <div class="card-header">
    <h2 th:text="${padreTutor.id == null} ? '👪 Nuevo Padre/Tutor' : '✏️ Editar Padre/Tutor'"></h2>
    <a th:href="@{/padres}" class="btn btn-outline btn-sm" style="color:#fff;border-color:#fff">← Volver</a>
  </div>
  <div class="card-body">
    <form th:action="@{/padres/guardar}" th:object="${padreTutor}" method="post">
      <input type="hidden" th:field="*{id}">
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label">Cédula <span style="color:#dc3545">*</span> <span style="font-size:.75rem;color:#888">(Módulo 10)</span></label>
          <input class="form-control" th:classappend="${#fields.hasErrors('cedula')} ? 'is-invalid'" type="text" id="cedula" th:field="*{cedula}" placeholder="10 dígitos" maxlength="10">
          <span id="cedulaHint" class="form-hint"></span>
          <span class="invalid-feedback" th:if="${#fields.hasErrors('cedula')}" th:errors="*{cedula}"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Nombre <span style="color:#dc3545">*</span></label>
          <input class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" type="text" th:field="*{nombre}">
          <span class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Apellido <span style="color:#dc3545">*</span></label>
          <input class="form-control" th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid'" type="text" th:field="*{apellido}">
          <span class="invalid-feedback" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Parentesco</label>
          <select class="form-control" th:field="*{parentesco}">
            <option value="">— Seleccionar —</option>
            <option value="Padre">Padre</option>
            <option value="Madre">Madre</option>
            <option value="Tutor">Tutor Legal</option>
            <option value="Abuelo/a">Abuelo/a</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Correo</label>
          <input class="form-control" type="email" th:field="*{correo}">
        </div>
        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <input class="form-control" type="text" th:field="*{telefono}">
        </div>
      </div>
      <div style="display:flex;gap:1rem;margin-top:1.5rem">
        <button type="submit" class="btn btn-accent">💾 Guardar</button>
        <a th:href="@{/padres}" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
</div>
</th:block>
</html>
