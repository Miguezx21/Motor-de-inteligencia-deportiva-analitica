<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title-text}, ~{::main-content})}">
<th:block th:fragment="title-text">Padres / Tutores</th:block>
<th:block th:fragment="main-content">
<div class="card">
  <div class="card-header"><h2>👪 Padres / Tutores</h2><a th:href="@{/padres/nuevo}" class="btn btn-accent btn-sm">+ Nuevo</a></div>
  <div class="card-body">
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Cédula</th><th>Nombre</th><th>Parentesco</th><th>Correo</th><th>Teléfono</th><th>Acciones</th></tr></thead>
        <tbody>
          <tr th:each="p : ${padres}">
            <td th:text="${p.cedula}"></td>
            <td th:text="${p.nombre} + ' ' + ${p.apellido}"></td>
            <td th:text="${p.parentesco}"></td>
            <td th:text="${p.correo}"></td>
            <td th:text="${p.telefono}"></td>
            <td style="display:flex;gap:.5rem">
              <a th:href="@{/padres/editar/{id}(id=${p.id})}" class="btn btn-outline btn-sm">✏️</a>
              <form th:action="@{/padres/eliminar/{id}(id=${p.id})}" method="post" onsubmit="return confirm('¿Eliminar?')">
                <button type="submit" class="btn btn-danger btn-sm">🗑️</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(padres)}"><td colspan="6" style="text-align:center;color:#888;padding:2rem">Sin padres/tutores</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</th:block>
</html>
