<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEMPE Admin — Login</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <style>body{display:block;background:linear-gradient(135deg,#0f2438 0%,#1a3a5c 100%)}</style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <img th:src="@{/img/logo.png}" alt="SkatePulse" style="width:160px;display:block;margin:0 auto 8px;">
      <h1>JEMPE Admin</h1>
      <p>Sistema de Gestión · Club JEMPE</p>
    </div>
    <div th:if="${param.error}" class="alert alert-danger">⚠️ Usuario o contraseña incorrectos.</div>
    <div th:if="${param.logout}" class="alert alert-info">✓ Sesión cerrada correctamente.</div>
    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <input class="form-control" type="text" id="username" name="username" placeholder="Ingresa tu usuario" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control" type="password" id="password" name="password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:.7rem">Ingresar →</button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:.75rem;color:#888">JEMPE · Quito, Ecuador · v1.0</p>
  </div>
</div>
</body>
</html>
