# ── BASE DE DATOS: H2 IN-MEMORY (MODO DESARROLLO) ─────────────────────────────
spring.datasource.url=jdbc:h2:mem:jempedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ── BASE DE DATOS: SQL SERVER (PRODUCCIÓN) ────────────────────────────────────
# Descomenta estas líneas y comenta las de H2 cuando vayas a producción:
#spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=JEMPE_DB;encrypt=false;trustServerCertificate=true
#spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
#spring.datasource.username=sa
#spring.datasource.password=TuPasswordSegura

# ── JPA / HIBERNATE ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── THYMELEAF ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── APP ───────────────────────────────────────────────────────────────────────
spring.application.name=jempe-admin
server.port=8080
