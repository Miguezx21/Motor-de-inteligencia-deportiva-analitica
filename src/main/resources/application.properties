# ── BASE DE DATOS ─────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:h2:mem:jempedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console (solo desarrollo local)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ── JPA / HIBERNATE ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# PostgreSQL requiere este dialecto en producción
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:}

# ── THYMELEAF ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── APP ───────────────────────────────────────────────────────────────────────
spring.application.name=jempe-admin
server.port=${PORT:8080}

# ── USUARIOS ──────────────────────────────────────────────────────────────────
app.admin.user=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:jempe2024}
app.entrenador.user=${ENTRENADOR_USER:alexis}
app.entrenador.password=${ENTRENADOR_PASSWORD:jempe2024}
